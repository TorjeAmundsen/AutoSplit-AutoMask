name: Validate build

on:
    pull_request:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      rid: win-x64
                    - os: ubuntu-latest
                      rid: linux-x64
                    - os: macos-latest
                      rid: macos-universal
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Install Linux AOT dependencies
              if: matrix.os == 'ubuntu-latest'
              run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

            - name: Publish (AOT)
              if: matrix.rid != 'macos-universal'
              shell: bash
              run: |
                  dotnet publish AutoMask/AutoMask.csproj \
                    -c Release \
                    -r ${{ matrix.rid }} \
                    --self-contained true \
                    -p:PublishAot=true \
                    -o build/${{ matrix.rid }}

            - name: Publish (AOT) and bundle (macOS)
              if: matrix.rid == 'macos-universal'
              shell: bash
              run: |
                  for rid in osx-arm64 osx-x64; do
                    dotnet publish AutoMask/AutoMask.csproj \
                      -c Release \
                      -r $rid \
                      --self-contained true \
                      -p:PublishAot=true \
                      -o build/$rid
                  done
                  version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' AutoMask/AutoMask.csproj)
                  bash macos/bundle.sh build/osx-arm64 build/osx-x64 "$version" build/macos-universal

            - uses: actions/upload-artifact@v7
              with:
                  name: AutoMask-pr${{ github.event.number }}-${{ matrix.rid }}
                  path: build/${{ matrix.rid }}
